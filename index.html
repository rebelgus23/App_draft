<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor de Disponibilidad</title>
    <style>
        /* Variables de color */
        :root {
            --bg-color: #f5f5f5; --surface-color: #ffffff; --text-color: #333333;
            --text-muted: #666666; --border-color: #e0e0e0; --primary-color: #4a148c;
            --primary-light: #7c43bd; --open-color: #00c853; --closed-color: #d50000;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-color: #121212; --surface-color: #1e1e1e; --text-color: #ffffff;
            --text-muted: #aaaaaa; --border-color: #333333; --primary-color: #7c43bd;
            --primary-light: #9c27b0; --open-color: #00e676; --closed-color: #ff1744;
            --shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-frame {
            width: 100%; max-width: 400px; height: 800px; background-color: var(--bg-color);
            border-radius: 30px; border: 10px solid #000; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;
        }

        .screen { display: none; height: 100%; flex-direction: column; padding: 20px; overflow-y: auto; background-color: var(--bg-color); }
        .screen.active { display: flex; }

        h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--text-color); }
        p { font-size: 0.9rem; color: var(--text-muted); }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .icon-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color); }
        
        .live-clock { text-align: center; font-size: 0.8rem; color: var(--primary-light); font-weight: bold; margin-bottom: 15px; }

        .search-bar {
            background: var(--surface-color); border: 1px solid var(--border-color); padding: 12px 15px;
            border-radius: 10px; color: var(--text-color); font-size: 1rem; margin-bottom: 20px; width: 100%; box-shadow: var(--shadow);
        }

        .card {
            background: var(--surface-color); border-radius: 15px; padding: 15px; margin-bottom: 10px;
            cursor: pointer; transition: transform 0.2s; border-left: 5px solid transparent; box-shadow: var(--shadow);
        }
        .card.open { border-left-color: var(--open-color); }
        .card.closed { border-left-color: var(--closed-color); }
        .card:hover { transform: scale(1.02); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; color: var(--text-color); }
        .status-badge { padding: 4px 8px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }
        .status-badge.open { background: rgba(0, 200, 83, 0.15); color: var(--open-color); }
        .status-badge.closed { background: rgba(213, 0, 0, 0.15); color: var(--closed-color); }

        .back-btn { background: none; border: none; color: var(--text-color); font-size: 1.5rem; cursor: pointer; margin-bottom: 10px; text-align: left; }
        .detail-header { border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px;}
        
        .schedule-info {
            display: flex; justify-content: space-between; background: var(--surface-color); 
            padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color);
        }
        .schedule-info span { font-size: 0.85rem; color: var(--text-color); font-weight: bold;}
        .schedule-info span i { color: var(--text-muted); font-weight: normal; font-style: normal;}

        .map-mock {
            width: 100%; height: 180px; border-radius: 10px; margin-bottom: 15px; position: relative; overflow: hidden; border: 1px solid var(--border-color);
            background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80');
            background-size: cover; background-position: center; filter: grayscale(30%);
        }
        body.dark-mode .map-mock { filter: grayscale(80%) brightness(0.6); }

        .map-pin {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%);
            width: 30px; height: 30px; background-color: #d50000; border-radius: 50% 50% 50% 0;
            transform: translate(-50%, -100%) rotate(-45deg); box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .map-pin::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background-color: white; border-radius: 50%; }

        .vote-section { background: var(--surface-color); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .vote-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 10px;}
        .btn-vote {
            background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 8px; color: var(--text-color);
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.9rem; font-weight: bold; width: 100px;
        }
        .btn-vote.valid { border: 1px solid var(--open-color); color: var(--open-color); }
        .btn-vote.invalid { border: 1px solid var(--closed-color); color: var(--closed-color); }

        .chat-container { flex-grow: 1; display: flex; flex-direction: column; }
        .chat-messages { flex-grow: 1; background: var(--surface-color); border-radius: 10px; padding: 10px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color); }
        .message { margin-bottom: 8px; font-size: 0.85rem; color: var(--text-color); border-bottom: 1px dashed var(--border-color); padding-bottom: 5px;}
        .message strong { color: var(--primary-light); }
        .message span { color: var(--text-muted); font-size: 0.7rem; margin-left: 5px;}
        
        .chat-input-area { display: flex; gap: 5px; }
        .chat-input { flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--surface-color); color: var(--text-color); }
        .btn-send { background: var(--primary-color); border: none; padding: 10px 15px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold;}

        .settings-group { background: var(--surface-color); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .settings-group label { display: block; color: var(--text-color); margin-bottom: 8px; font-weight: bold; font-size: 0.9rem;}
        .settings-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); margin-bottom: 15px;}
        
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(26px); }

        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--surface-color); padding: 30px; border-radius: 20px; text-align: center; width: 85%; box-shadow: var(--shadow);}
        .modal-content input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);}
        .btn-primary { background: var(--primary-color); border: none; padding: 12px; border-radius: 8px; color: white; cursor: pointer; width: 100%; font-weight: bold;}
    </style>
</head>

            </div>

            </div>

                    <button class="btn-send" onclick="tryComment()">Enviar</button>
                </div>
            </div>
        </div>

            <div class="settings-group">

        </div>

        // === 2. LÓGICA DE TIEMPO REAL POR DÍA ===
        function getCurrentTimeInMinutes() {
            const now = new Date();
            return (now.getHours() * 60) + now.getMinutes();
        }

        function timeStringToMinutes(timeStr) {
            if (timeStr === '24:00') return 1440;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return (hours * 60) + minutes;
        }

        function determineStatus(scheduleArray) {
            const now = new Date();
            const currentDay = now.getDay(); // 0 = Domingo, 1 = Lunes, etc.
            const todaySchedule = scheduleArray[currentDay];

            // Si hoy no hay horario, está cerrado todo el día
            if (!todaySchedule) return { status: 'Cerrado', type: 'closed' };

            const currentMins = getCurrentTimeInMinutes();
            const openMins = timeStringToMinutes(todaySchedule.open);
            const closeMins = timeStringToMinutes(todaySchedule.close);

            // Horario que cruza la medianoche (ej: 17:00 a 24:00)
            if (closeMins === 1440) {
                if (currentMins >= openMins) return { status: 'Abierto', type: 'open' };
                // Para el caso de las 00:00 a 08:00 del día siguiente, si el cierre es 24:00, se considera abierto hasta la medianoche.
                // Pero si el día siguiente abre a las 00:00, la lógica cambiaría. Aquí simplificamos.
            }
            
            // Horario normal
            if (currentMins >= openMins && currentMins < closeMins) {
                return { status: 'Abierto', type: 'open' };
            }
            
            return { status: 'Cerrado', type: 'closed' };
        }

        function updateSystemClock() {

            document.getElementById('clock-display').innerText = `🟢 Reloj en vivo: ${timeString} (Evaluando horarios reales)`;
        }

        // === 3. RENDERIZAR LISTA DINÁMICAMENTE ===
        function renderList() {
            const listContainer = document.getElementById('places-list');
            listContainer.innerHTML = '';

            updateSystemClock();

            for (const [key, data] of Object.entries(placesData)) {
                const currentStatus = determineStatus(data.schedule);
                
                const card = document.createElement('div');
                card.className = `card ${currentStatus.type}`;
                card.id = `card-${key}`;
                card.onclick = () => openDetail(key);
                
                // Obtener el horario de hoy para mostrarlo
                const today = new Date().getDay();
                const todaySchedule = data.schedule[today];
                const scheduleText = todaySchedule ? `${todaySchedule.open} - ${todaySchedule.close}` : 'Cerrado hoy';

                card.innerHTML = `
                    <div class="card-header">
                        <strong>${data.name}</strong>
                        <span class="status-badge ${currentStatus.type}">${currentStatus.status}</span>
                    </div>
                    <p>Horario de hoy: ${scheduleText}</p>
                `;
                listContainer.appendChild(card);
            }
        }

        // === 4. NAVEGACIÓN Y FILTRO ===
        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-list') updateSystemClock();
        }

        function filterSearch() {
            let input = document.getElementById('search-bar').value.toLowerCase();
            let cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                let title = card.querySelector('strong').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "block" : "none";
            });
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

        function updateUsername() {
            let input = document.getElementById('username-input').value;
            if(!input.startsWith('@')) { input = '@' + input; }
            currentUsername = input;
        }

        // === 5. DETALLE ===
        function openDetail(placeKey) {
            goToScreen('screen-detail');
            currentPlaceKey = placeKey;
            hasVoted = false;

            const data = placesData[placeKey];
            const currentStatus = determineStatus(data.schedule);

            // Cabecera y Estado
            document.getElementById('detail-title').innerText = data.name;
            const statusBadge = document.getElementById('detail-status');
            statusBadge.innerText = currentStatus.status;
            statusBadge.className = `status-badge ${currentStatus.type}`;
            
            // Horas de hoy
            const today = new Date().getDay();
            const todaySchedule = data.schedule[today];
            document.getElementById('detail-open-time').innerText = todaySchedule ? todaySchedule.open : '--:--';
            document.getElementById('detail-close-time').innerText = todaySchedule ? todaySchedule.close : '--:--';

            // Chat
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            data.comments.forEach(c => {
                chatBox.innerHTML += `<div class="message"><strong>${c.user}</strong> <span>${c.time}</span><br>${c.text}</div>`;
            });

            // Votos
            updateVoteUI();
        }

        // === 6. VOTOS Y CHAT ===
        function updateVoteUI() {
            const data = placesData[currentPlaceKey].votes;
            const total = data.yes + data.no;
            const pctYes = Math.round((data.yes / total) * 100);
            const pctNo = 100 - pctYes;

            document.getElementById('vote-total').innerText = `Han opinado ${total} personas`;
            document.getElementById('vote-yes-btn').innerText = `✔ Sí (${pctYes}%)`;
            document.getElementById('vote-no-btn').innerText = `✖ No (${pctNo}%)`;
        }

        function vote(isValid) {
            if (!isLoggedIn) {
                document.getElementById('login-modal').classList.add('active');
                return;
            }
            if (hasVoted) { alert("Ya has votado en este lugar."); return; }

            if (isValid) placesData[currentPlaceKey].votes.yes++;
            else placesData[currentPlaceKey].votes.no++;
            
            hasVoted = true;
            updateVoteUI();

            const btn = isValid ? document.getElementById('vote-yes-btn') : document.getElementById('vote-no-btn');
            btn.style.transform = "scale(0.95)";
            setTimeout(() => btn.style.transform = "scale(1)", 150);
        }

        function tryComment() {
            if (!isLoggedIn) document.getElementById('login-modal').classList.add('active');
            else addComment();
        }

        function fakeLogin() {
            isLoggedIn = true;
            document.getElementById('login-modal').classList.remove('active');
            if(document.getElementById('chat-input').value.trim() !== "") addComment(); 
        }

        function addComment() {
            const input = document.getElementById('chat-input');
            const text = input.value;
            if (text.trim() === "") return;

            const chatBox = document.getElementById('chat-box');
            const newMsg = document.createElement('div');
            newMsg.className = 'message';
            newMsg.innerHTML = `<strong>${currentUsername}</strong> <span>ahora mismo</span><br>${text}`;
            chatBox.insertBefore(newMsg, chatBox.firstChild);
            
            placesData[currentPlaceKey].comments.unshift({ user: currentUsername, time: 'ahora mismo', text: text });
            input.value = "";
        }

        // === 7. INICIALIZACIÓN Y ACTUALIZACIÓN AUTOMÁTICA ===
        window.onload = () => { 
            renderList(); 
            // Actualizar los estados cada 60 segundos si la página queda abierta
            setInterval(() => {
                if(document.getElementById('screen-list').classList.contains('active')) {
                    renderList();
                }
            }, 60000);
        };
    </script>
</body>
</html>
